<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- PAGE_METADATA -->

  <link rel="icon" data-content-attr="href:assets.favicon" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav" data-i18n-attr="aria-label:nav.label">
      <a class="logo" href="#top" data-i18n-attr="aria-label:nav.home" data-content="site.logoInitials"></a>

      <div class="nav-actions">
        <div class="language-switcher" data-i18n-attr="aria-label:nav.languages">
          <a class="lang-button" data-lang-switch="uk" href="/uk/" hreflang="uk" lang="uk" aria-label="Українська">UA</a>
          <a class="lang-button" data-lang-switch="en" href="/en/" hreflang="en" lang="en" aria-label="English">EN</a>
        </div>
        <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" data-i18n="nav.menu"></button>
      </div>

      <div class="nav-menu" id="nav-menu">
        <a href="#patients" data-i18n="nav.patients"></a>
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#expertise" data-i18n="nav.expertise"></a>
        <a href="#contact" data-i18n="nav.contact"></a>
        <a href="#projects" data-i18n="nav.projects"></a>
        <a href="#publications" data-i18n="nav.publications"></a>
      </div>
    </nav>
  </header>

  <main id="top">
    <section class="hero section">
      <div class="hero-content">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 data-i18n="hero.displayName"></h1>
        <p class="subtitle" data-i18n="hero.subtitle"></p>
        <p class="institution">
          <a class="institution-link" data-content-attr="href:links.center">
            <img data-content-attr="src:assets.institutionLogo" width="501" height="501" alt="" />
            <span data-i18n="hero.institution"></span>
          </a>
        </p>
        <p class="hero-summary" data-i18n="hero.summary"></p>
        <div class="cta-row">
          <a class="button primary" href="#contact" data-i18n="hero.contactButton"></a>
          <a class="secondary-link" href="#patients" data-i18n="patients.title"></a>
        </div>
      </div>
      <div class="hero-card">
        <img data-content-attr="src:assets.portrait" width="1200" height="1500" alt="" class="profile-photo" data-i18n-attr="alt:hero.photoAlt" />
      </div>
    </section>

    <section class="section" id="patients">
      <div class="section-heading">
        <h2 data-i18n="patients.title"></h2>
      </div>
      <p class="lead" data-i18n="patients.intro"></p>
      <ul class="visit-checklist">
        <li data-i18n="patients.imaging" data-allow-strong></li>
        <li data-i18n="patients.records" data-allow-strong></li>
        <li data-i18n="patients.pathology" data-allow-strong></li>
        <li data-i18n="patients.questions" data-allow-strong></li>
      </ul>
      <p data-i18n="patients.chronology"></p>
      <div class="cta-row">
        <a class="button primary" href="#contact" data-i18n="hero.contactButton"></a>
      </div>
    </section>

    <section class="section" id="about">
      <div class="section-heading">
        <h2 data-i18n="about.title"></h2>
      </div>
      <p class="lead" data-i18n="about.lead" data-allow-strong></p>
      <p class="lead" data-i18n="about.text" data-allow-strong></p>
      <p class="lead" data-i18n="about.consultation"></p>
    </section>

    <section class="section" id="expertise">
      <div class="section-heading">
        <h2 data-i18n="expertise.title"></h2>
      </div>
      <div class="grid cards">
        <article class="card">
          <h3 data-i18n="expertise.liverTumors.title"></h3>
          <p data-i18n="expertise.liverTumors.text"></p>
        </article>
        <article class="card">
          <h3 data-i18n="expertise.laparoscopy.title"></h3>
          <p data-i18n="expertise.laparoscopy.text"></p>
        </article>
        <article class="card">
          <h3 data-i18n="expertise.transplant.title"></h3>
          <p data-i18n="expertise.transplant.text"></p>
        </article>
      </div>
    </section>

    <section class="section contact-section" id="contact" data-nosnippet>
      <div class="section-heading">
        <h2 data-i18n="contact.title"></h2>
      </div>
      <div>
        <h3 data-i18n="contact.inPerson"></h3>
        <p class="lead" data-i18n="contact.booking"></p>
        <div class="cta-row booking-actions">
          <a class="button primary direct-call" data-content-attr="href:contacts.phone" data-prefix="tel:" data-i18n="contact.callMe"></a>
          <a class="button" data-content-attr="href:contacts.centerTel" data-i18n="contact.callCenter"></a>
        </div>
      </div>
      <div>
        <h3 data-i18n="contact.remote"></h3>
        <p class="lead" data-i18n="contact.remoteIntro"></p>
        <div class="button-row">
          <a class="button" data-content-attr="href:contacts.telegramUrl" target="_blank" rel="noopener"><img class="service-icon" src="img/icons/telegram.svg" width="22" height="22" alt="" /><span data-i18n="contact.telegram"></span></a>
          <a class="button" data-content-attr="href:contacts.email" data-prefix="mailto:"><img class="service-icon" src="img/icons/email.svg" width="22" height="22" alt="" /><span data-i18n="contact.email"></span></a>
        </div>
      </div>
      <div class="button-row">
        <a class="button" data-vcard download rel="nofollow" data-i18n-attr="title:contact.vcardTooltip"><img class="service-icon" src="img/icons/contacts.svg" width="22" height="22" alt="" /><span data-i18n="contact.vcard"></span></a>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="section-heading">
        <h2 data-i18n="projects.title"></h2>
      </div>
      <div class="link-list">
        <a data-content-attr="href:links.book" target="_blank" rel="noopener"><img class="service-icon" src="img/icons/book.svg" width="22" height="22" alt="" aria-hidden="true" /><div class="resource-copy"><span data-i18n="projects.book.label"></span>
          <strong data-i18n="projects.book.title"></strong></div></a>
        <a data-content-attr="href:links.youtube" target="_blank" rel="noopener"><img class="service-icon" src="img/icons/youtube.svg" width="22" height="22" alt="" aria-hidden="true" /><div class="resource-copy"><span data-i18n="projects.youtube.label"></span>
          <strong data-i18n="projects.youtube.title"></strong></div></a>
        <a data-content-attr="href:links.telegramChannel" target="_blank" rel="noopener"><img class="service-icon" src="img/icons/telegram.svg" width="22" height="22" alt="" aria-hidden="true" /><div class="resource-copy"><span data-i18n="projects.telegram.label"></span>
          <strong data-i18n="projects.telegram.title"></strong></div></a>
      </div>
    </section>

    <section class="section" id="publications">
      <div class="section-heading">
        <h2 data-i18n="publications.title"></h2>
      </div>
      <div class="button-row">
        <a class="button" data-content-attr="href:links.orcid" target="_blank" rel="noopener"><img class="service-icon" src="img/icons/orcid.svg" width="22" height="22" alt="" aria-hidden="true" />ORCID</a>
        <a class="button" data-content-attr="href:links.googleScholar" target="_blank" rel="noopener"><img class="service-icon" src="img/icons/googlescholar.svg" width="22" height="22" alt="" aria-hidden="true" />Google Scholar</a>
        <a class="button" data-content-attr="href:links.researchGate" target="_blank" rel="noopener"><img class="service-icon" src="img/icons/researchgate.svg" width="22" height="22" alt="" aria-hidden="true" />ResearchGate</a>
        <a class="button" data-content-attr="href:links.scopus" target="_blank" rel="noopener"><img class="service-icon" src="img/icons/scopus.svg" width="22" height="22" alt="" aria-hidden="true" />Scopus</a>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> <span data-content="site.copyrightName"></span>. <span data-i18n="footer.rights"></span></p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
